<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tok Toe</title>

    <!--Tailwind-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--Google Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:ital,wght@0,300..900;1,300..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Pacifico&display=swap" rel="stylesheet">

</head>

<body class="bg-purple-800">
    <section class="flex h-screen">
        <div class="flex items-end font-semibold text-[170px] leading-[0.6] p-10 text-yellow-300" style="font-family: 'Caprasimo', cursive;">
            <h1>tic.
                <br><span class="text-sky-400">tac.</span> <br>
                toe.
            </h1>
        </div>
        <div class="flex flex-col justify-end items-center grow font-semibold">
            <div class="flex flex-col text-4xl disabled gap-3 ">
                <div class="flex flex-row gap-3">
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-sky-400"></button>
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-yellow-300"></button>
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-sky-400"></button>
                </div>
                <div class="flex flex-row gap-3">
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-sky-400 "></button>
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-yellow-300"></button>
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-sky-400"></button>
                </div>
                <div class="flex flex-row gap-3">
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-sky-400"></button>
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-yellow-300"></button>
                    <button class="cell h-23 w-23 bg-purple-950 rounded-lg  text-sky-400"></button>
                </div>
            </div>
            <div class="flex justify-center items-center mt-8">
                <p class="declare text-2xl font-bold text-neutral-300"></p>
            </div>
            <div class="flex justify-center items-center m-4">
                <button class="reset bg-green-500 pr-10 pl-10 p-2 text-neutral-100 text-2xl font-semibold "> Reset </button>
            </div>
        </div>
    </section>

    <!--JS-->
    <script src="app.js"></script>
</body>

</html>
